services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: carhunt
      POSTGRES_USER: carhunt
      POSTGRES_PASSWORD: carhunt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed_dealers.sql:/docker-entrypoint-initdb.d/02_seed_dealers.sql

volumes:
  postgres_data:
